services:
  postgres:
    image: postgres:16
    container_name: mvp-ia-postgres
    environment:
      POSTGRES_USER: mvp_ia
      POSTGRES_PASSWORD: mvp_ia_local_dev
      POSTGRES_DB: mvp_instructional_agent
    ports:
      - "5432:5432"
    volumes:
      - mvp_ia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp_ia -d mvp_instructional_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mvp_ia_pgdata:
