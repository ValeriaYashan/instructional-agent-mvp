[project]
name = "mvp-instructional-agent"
version = "0.1.0"
description = "Iteracion 1 - fundacion de persistencia y concurrencia del Agente IA de Diseno Instruccional (slice PRODUCE_LEARNING_OBJECT)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "testcontainers[postgres]>=4.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "testcontainers[postgres]>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

